[phases.setup]
nixPkgs = ["php84", "php84Extensions.pgsql", "php84Extensions.pdo_pgsql", "php84Extensions.mbstring", "php84Extensions.tokenizer", "php84Extensions.xml", "php84Extensions.ctype", "php84Extensions.curl", "php84Extensions.dom", "php84Extensions.fileinfo", "php84Extensions.filter", "php84Extensions.openssl", "php84Packages.composer", "nginx", "nodejs_22", "npm-10_x"]

[phases.install]
cmds = [
    "mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx",
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "node /assets/scripts/prestart.mjs /assets/nginx.template.conf /nginx.conf && (php-fpm -y /assets/php-fpm.conf & nginx -c /nginx.conf)"
